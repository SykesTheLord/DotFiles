# User-specific window rules — supplements omarchy's default/hypr/apps/*.conf
# Omarchy already covers: bitwarden, browser, steam, retroarch, pip, jetbrains (basic),
# system, localsend, typora, walker, terminals, 1password, telegram

# Paradox Launcher
windowrule {
    name = paradox-launcher
    float = on
    center = on
    match:class = ^(Paradox Launcher)$
}

# HOI4
windowrule {
    name = hoi4
    fullscreen = on
    opacity = 1 override 1 override
    match:class = ^(hoi4)$
}

# YouTube — always full opacity
windowrule {
    name = youtube-opacity
    opacity = 1 override 1 override
    match:initial_title = ^(youtube\.com_/)$
}

# Media & productivity apps — always full opacity
windowrule {
    name = media-apps-opacity
    opacity = 1 override 1 override
    match:class = ^(zoom|vlc|mpv|org\.kde\.kdenlive|com\.obsproject\.Studio|com\.github\.PintaProject\.Pinta|imv)$
}

# KDE file pickers — float and center
windowrule {
    name = kde-file-pickers
    float = on
    center = on
    match:class = ^(org\.kde\..*)$
    match:title = ^(Open.*Files?|Save.*Files?|All Files|Save|Open.*Ark?|Extract.*Ark?)
}

# Custom GTK app
windowrule {
    name = sykes-gtk
    opacity = 1 override 1 override
    match:initial_class = ^(sykes\.gtk\.example)$
}

# Microsoft apps
windowrule {
    name = microsoft-apps
    opacity = 1 override 1 override
    match:initial_class = ^(Microsoft.*)$
}

# Ghidra — force tiled, full opacity
windowrule {
    name = ghidra
    tile = on
    opacity = 1 override 1 override
    match:class = ^(ghidra-Ghidra)$
}

windowrule {
    name = ghidra-tip
    float = on
    center = on
    match:title = ^(Tip of the Day)$
}

# JetBrains extended rules (supplements omarchy's basic jetbrains.conf)
windowrule {
    name = jb-tag
    tag = +jb
    center = off
    match:class = ^jetbrains-.+$
}

windowrule {
    name = jb-splash
    float = on
    no_initial_focus = on
    stay_focused = off
    opacity = override 1 override 0.85
    match:tag = jb
}

windowrule {
    name = jb-tooltip-nofocus
    no_focus = on
    match:class = ^jetbrains-.*$
    match:title = .*(Tooltip).*$
}

windowrule {
    name = jb-dialogs
    float = on
    match:class = ^jetbrains-.*$
    match:title = .*(Dialog|Tooltip|Popup|Menu).*$
}

windowrule {
    name = jb-settings
    float = on
    no_initial_focus = off
    center = on
    match:class = ^jetbrains-.*$
    match:title = .*(Settings|Preferences|Project Structure).*$
}

windowrule {
    name = jb-win
    float = on
    no_initial_focus = off
    match:class = ^jetbrains-.*$
    match:title = ^win.*$
}

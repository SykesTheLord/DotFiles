; ---------------------------
;   MODULES
; ---------------------------

;---- Workspaces (icons/glyphs follow your Waybar setup) ----
[module/xworkspaces]
type = internal/xworkspaces
pin-workspaces = false
enable-click = true
enable-scroll = true

; Use your Waybar glyphs: default "", active "󱓻"
icon-default = 
icon-0 = 1;1
icon-1 = 2;2
icon-2 = 3;3
icon-3 = 4;4
icon-4 = 5;5
icon-5 = 6;6
icon-6 = 7;7
icon-7 = 8;8
icon-8 = 9;9

format = <label-state>
label-active = %{B${colors.activebg}}%{F#c0caf5}󱓻%{F-}%{B-}
label-occupied = %{B${colors.bg_alt}}%{F#c0caf5}%icon%%{F-}%{B-}
label-urgent = %{B${colors.urgent}}%{F#1e1e2e}%icon%%{F-}%{B-}
label-empty = %{F${colors.muted}}%icon%%{F-}

;---- Focused window title ----
[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%
format-foreground = ${colors.fg}

;---- Audio (PulseAudio) ----
[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true
interval = 5
; Icons match your Waybar ramp + mute glyphs
label-muted = 󰝟
format-volume = <ramp-volume>
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
click-left = pavucontrol
click-right = pamixer -t
scroll-up = pamixer -i 5
scroll-down = pamixer -d 5

;---- Backlight ----
[module/backlight]
type = internal/backlight
; If auto-detect fails, set: card = intel_backlight  (or amdgpu_bl0, etc.)
format = <ramp> %percentage%%
ramp-0 = 
ramp-1 = 

;---- Network (single module, works for wifi/ethernet) ----
[module/network]
type = internal/network
; If needed, pin: interface = wlan0  OR  interface-type = wireless|wired
interval = 3
format-connected = <label-connected>
format-disconnected = 󰖪
label-connected = %ifname%  %downspeed:8%  %upspeed:8%
; Left-click can open a network UI if you use one:
click-left = alacritty -e nmtui

;---- Bluetooth (script, mirrors your Waybar icons) ----
[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth.sh
interval = 5
click-left = blueman-manager

;---- CPU (click -> btop, like your Waybar) ----
[module/cpu]
type = internal/cpu
interval = 2
format = 󰍛
click-left = alacritty -e btop

;---- Memory ----
[module/memory]
type = internal/memory
interval = 5
format =   %used% / %total%

;---- Temperature ----
[module/temperature]
type = internal/temperature
; If needed, set thermal-zone or hwmon-path explicitly
format =  %temperature-c%°C
format-crit =  %temperature-c%°C

;---- Keyboard layout (Hyprland/language -> xkeyboard) ----
[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
label-layout =   %layout%
label-indicator-on = %name%

;---- Notifications (dunst) ----
[module/notification]
type = custom/script
exec = ~/.config/polybar/scripts/notification.sh
interval = 3
click-left = dunstctl history-pop
click-right = dunstctl set-paused toggle

;---- Power profiles (powerprofilesctl) ----
[module/powerprofile]
type = custom/script
exec = ~/.config/polybar/scripts/powerprofiles.sh
interval = 5
click-left = powerprofilesctl set performance
click-middle = powerprofilesctl set balanced
click-right = powerprofilesctl set power-saver

;---- Battery ----
[module/battery]
type = internal/battery
battery = BAT0         ; adjust to BAT1/BAT2 if needed
adapter = AC
full-at = 98
format-full =   %percentage%%
format-charging = 󰂄  %percentage%%
format-discharging = <ramp-capacity> %percentage%%
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

;---- Clock ----
[module/date]
type = internal/date
interval = 1
date = %H:%M | %e %B
date-alt = %Y-%m-%d
label = %date%

;---- System Tray (new-style tray module; only ONE per session) ----
[module/tray]
type = internal/tray
tray-size = 16
tray-padding = 4
format = <tray>


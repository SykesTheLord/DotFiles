#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
exec-once = nm-applet &
exec-once = waybar
# Run polkit for auth pop ups
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = blueman-applet
exec-once = hypridle
exec-once = spotify-launcher
exec-once = webcord
exec-once = slimbookbattery --minimize
exec-once = am -u

exec-once = gsettings set org.gnome.desktop.interface gtk-theme "arc-dark"   # for GTK3 apps
exec-once = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"
exec-once = systemctl start --user wallpaperset.service
exec-once = systemctl start --user hypr-keybind-config-switcher.service
exec-once = wl-clip-persist --clipboard regular --all-mime-type-regex '^(?!x-kde-passwordManagerHint).+'

